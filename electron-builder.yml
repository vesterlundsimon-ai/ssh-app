appId: com.simssh.app
productName: SimSSH
copyright: Copyright © 2026 Simon Vesterlund
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
# ssh2's native speed-ups are optional; the pure-JS fallback is used instead,
# so no C++ toolchain is needed to build the installer.
npmRebuild: false
asar: true
# Where in-app updates come from. Builds never publish by themselves (--publish never);
# this only writes app-update.yml into the app and latest.yml next to the installer.
publish:
  provider: github
  owner: vesterlundsimon-ai
  repo: ssh-app
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: SimSSH-Setup-${version}.${ext}
nsis:
  # Same id as the installer used when the app was called Shellport, so installing
  # SimSSH upgrades it in place instead of leaving two apps installed.
  guid: 557c8bc8-40f6-5c9d-a7a5-85c58f6ec6cf
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SimSSH
  uninstallDisplayName: SimSSH
  deleteAppDataOnUninstall: false
# Electron fuses: switch off Node.js debugging/injection features the app never uses,
# and make Windows refuse to run a tampered app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
