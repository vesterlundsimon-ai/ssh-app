name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Used by the daily security check to build and publish a fix release.
  workflow_call:
    inputs:
      ref:
        description: Tag to build and release, e.g. refs/tags/v0.4.2
        type: string
        required: true
      release_notes:
        description: Release notes (Markdown)
        type: string
        default: ''

# Least privilege: read-only by default; only the release step gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, audit and SSH/SFTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify package signatures
        run: npm audit signatures
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - uses: ./.github/actions/ssh-test-server
      - run: npm run test:unit
      - run: npm run test:backend

  installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check the release tag matches package.json
        if: startsWith(inputs.ref || github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:REF -replace '^refs/tags/', ''
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag doesn't match the version in package.json (v$version). The in-app updater reads the version from package.json, so release the tag v$version instead."
            exit 1
          }
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record installer checksum
        shell: pwsh
        run: Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SimSSH-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(inputs.ref || github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: tag
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          echo "name=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SimSSH-installer
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # Releases made by the security check get a name and notes; releases you create keep yours.
          name: ${{ inputs.release_notes && format('SimSSH {0}', steps.tag.outputs.version) || '' }}
          body: ${{ inputs.release_notes }}
          # latest.yml and the .blockmap are what the in-app updater reads.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          generate_release_notes: true
