name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; only the release step gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, audit and SSH/SFTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify package signatures
        run: npm audit signatures
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - name: Start a throwaway SSH server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          sudo useradd -m -s /bin/bash tester
          echo 'tester:ci-password' | sudo chpasswd
          mkdir -p "$RUNNER_TEMP/keys"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/keys/id_plain"
          ssh-keygen -q -t ed25519 -N 'ci-pass' -f "$RUNNER_TEMP/keys/id_enc"
          sudo mkdir -p /home/tester/.ssh /run/sshd
          cat "$RUNNER_TEMP"/keys/*.pub | sudo tee /home/tester/.ssh/authorized_keys > /dev/null
          sudo chown -R tester:tester /home/tester/.ssh && sudo chmod 700 /home/tester/.ssh
          printf 'Port 2222\nListenAddress 127.0.0.1\nHostKey /etc/ssh/ssh_host_ed25519_key\nPasswordAuthentication yes\nUsePAM yes\nSubsystem sftp internal-sftp\nPidFile /tmp/sshd-ci.pid\n' > "$RUNNER_TEMP/sshd_config"
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"
      - run: npm run test:unit
      - run: npm run test:backend
        env:
          TEST_HOST: 127.0.0.1
          TEST_PORT: 2222
          TEST_USER: tester
          TEST_PASSWORD: ci-password
          TEST_KEY: ${{ runner.temp }}/keys/id_plain
          TEST_ENC_KEY: ${{ runner.temp }}/keys/id_enc
          TEST_KEY_PASS: ci-pass

  installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record installer checksum
        shell: pwsh
        run: Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Shellport-installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Shellport-installer
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
