name: SSH test server
description: Starts a throwaway OpenSSH server on 127.0.0.1:2222 with a test user and keys, and sets the TEST_* variables the backend tests read. With post-quantum, also builds OpenSSH 10.6 and runs it on port 2225 accepting only mlkem768x25519-sha256.
inputs:
  post-quantum:
    description: Also start an OpenSSH 10.6 server that only allows post-quantum key exchange
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
        sudo useradd -m -s /bin/bash tester
        echo 'tester:ci-password' | sudo chpasswd
        mkdir -p "$RUNNER_TEMP/keys"
        ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/keys/id_plain"
        ssh-keygen -q -t ed25519 -N 'ci-pass' -f "$RUNNER_TEMP/keys/id_enc"
        sudo mkdir -p /home/tester/.ssh /run/sshd
        cat "$RUNNER_TEMP"/keys/*.pub | sudo tee /home/tester/.ssh/authorized_keys > /dev/null
        sudo chown -R tester:tester /home/tester/.ssh && sudo chmod 700 /home/tester/.ssh && sudo chmod 600 /home/tester/.ssh/authorized_keys
        printf 'Port 2222\nListenAddress 127.0.0.1\nHostKey /etc/ssh/ssh_host_ed25519_key\nPasswordAuthentication yes\nUsePAM yes\nSubsystem sftp internal-sftp\nPidFile /tmp/sshd-ci.pid\n' > "$RUNNER_TEMP/sshd_config"
        sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"
        {
          echo "TEST_HOST=127.0.0.1"
          echo "TEST_PORT=2222"
          echo "TEST_USER=tester"
          echo "TEST_PASSWORD=ci-password"
          echo "TEST_KEY=$RUNNER_TEMP/keys/id_plain"
          echo "TEST_ENC_KEY=$RUNNER_TEMP/keys/id_enc"
          echo "TEST_KEY_PASS=ci-pass"
        } >> "$GITHUB_ENV"
    - name: Build and start OpenSSH 10.6 (post-quantum only)
      if: inputs.post-quantum == 'true'
      shell: bash
      run: |
        sudo apt-get install -y -qq autoconf build-essential zlib1g-dev libssl-dev
        src="$RUNNER_TEMP/openssh"
        git clone -q --depth 1 --branch V_10_6_P1 https://github.com/openssh/openssh-portable "$src"
        # Pin the exact commit behind the V_10_6_P1 tag.
        test "$(git -C "$src" rev-parse HEAD)" = a8c72b842423f0774f542d3c2197247c3dd28d74
        (cd "$src" && autoreconf && ./configure -q --without-pam > /dev/null && make -s -j"$(nproc)" sshd sshd-session sshd-auth > /dev/null)
        printf 'Port 2225\nListenAddress 127.0.0.1\nHostKey /etc/ssh/ssh_host_ed25519_key\nKexAlgorithms mlkem768x25519-sha256\nPasswordAuthentication yes\nSubsystem sftp internal-sftp\nSshdSessionPath %s/sshd-session\nSshdAuthPath %s/sshd-auth\nPidFile /tmp/sshd-pq.pid\nLogLevel DEBUG1\n' "$src" "$src" > "$RUNNER_TEMP/sshd_pq_config"
        sudo mkdir -p /var/empty
        sudo "$src/sshd" -f "$RUNNER_TEMP/sshd_pq_config" -E /tmp/sshd-pq.log
        echo "TEST_PQ_PORT=2225" >> "$GITHUB_ENV"
